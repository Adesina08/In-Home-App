<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offline — INICIO</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background:#F8FAFC; color:#1F2937; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; text-align:center; padding:24px; }
  .card { max-width: 360px; }
  .brand { color:#1F3864; font-weight:700; font-size:20px; margin-bottom:8px; }
  .icon { font-size: 40px; margin-bottom: 12px; }
  button { margin-top: 16px; background:#1F3864; color:white; border:none; border-radius:8px; padding:10px 20px; font-size:14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <div class="brand">INICIO</div>
    <p>You're offline right now. Any diary answers you'd started typing are kept on this device — reopen the app once you're back online to pick up where you left off.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
