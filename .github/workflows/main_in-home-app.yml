# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - In-Home-App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm install

      - name: Build production Android APK
        run: |
          cd mobile
          npm install
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ../../..
          mkdir -p public/downloads
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk public/downloads/inicio-inhome.apk
          test -s public/downloads/inicio-inhome.apk

      - name: Build and test web application
        run: |
          npm run build --if-present
          npm run test --if-present

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: inicio-inhome-apk
          path: public/downloads/inicio-inhome.apk
          if-no-files-found: error

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_087D6C704C4C4218AB38BC4BC07BEDE0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2F1EA5A5307B4917B42D53F6C76A3562 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6D13A5DDBA754F02A2CBC89160C6FB01 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'In-Home-App'
          slot-name: 'Production'
          package: .
