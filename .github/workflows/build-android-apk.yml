# Builds the signed Inicio Diary Android APK on demand.
#
# Run it from the Actions tab: "Build Android APK" -> Run workflow.
# The signed APK is attached to the run as a downloadable artifact.
#
# The signing key is never in this repository. It arrives from three repository
# secrets and is written to a file that exists only for the length of the job.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown to respondents (e.g. 1.0.1)'
        required: false
        default: '1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Sync web assets into the Android project
        working-directory: mobile
        run: npx cap sync android

      # Written to the runner's temp dir, which is destroyed with the runner.
      # Never inside the checkout, so it cannot be committed or uploaded.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "Keystore restored ($(stat -c%s "$RUNNER_TEMP/release.jks") bytes)"

      - name: Build the signed release APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon

      # A build that quietly produced an unsigned APK would be worse than a
      # failed one: it installs on the test phone and is rejected on update.
      - name: Verify the APK is signed
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed APK produced. Check the signing secrets."
            ls -la mobile/android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: inicio-diary-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
