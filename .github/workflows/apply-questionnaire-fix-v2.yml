name: Apply questionnaire draft/versioning patch v2
on:
  push:
    branches:
      - fix/questionnaire-draft-preview-versioning
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat .patchpart_00 .patchpart_01 .patchpart_02 .patchpart_03 .patchpart_04 .patchpart_05 > /tmp/questionnaire.patch.gz.b64
          base64 -d /tmp/questionnaire.patch.gz.b64 | gzip -d > /tmp/questionnaire.patch
          git apply --check /tmp/questionnaire.patch
          git apply /tmp/questionnaire.patch
          rm -f .patchpart_00 .patchpart_01 .patchpart_02 .patchpart_03 .patchpart_04 .patchpart_05 .questionnaire-patch.gz.b64
          rm -f .github/workflows/apply-questionnaire-fix.yml .github/workflows/apply-questionnaire-fix-v2.yml
          git add -A
          git config user.name "Inicio Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Apply questionnaire draft preview and versioning fix"
          git push origin HEAD:fix/questionnaire-draft-preview-versioning
