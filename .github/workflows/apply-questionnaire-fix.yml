name: Apply questionnaire draft/versioning patch

on:
  push:
    branches:
      - fix/questionnaire-draft-preview-versioning

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply questionnaire draft preview and versioning fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .questionnaire-patch.gz.b64 | gzip -d > /tmp/questionnaire.patch
          git apply --check /tmp/questionnaire.patch
          git apply /tmp/questionnaire.patch
          rm -f .questionnaire-patch.gz.b64 .github/workflows/apply-questionnaire-fix.yml
          git add -A
          git config user.name "Inicio Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Apply questionnaire draft preview and versioning fix"
          git push origin HEAD:fix/questionnaire-draft-preview-versioning
