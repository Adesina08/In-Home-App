name: Validate respondent password recovery

on:
  pull_request:
    paths:
      - 'routes/mobile.js'
      - 'routes/mobilePasswordRecovery.js'
      - 'tests/passwordRecovery.test.js'
  workflow_dispatch:

jobs:
  password-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check recovery route syntax
        run: |
          node --check routes/mobile.js
          node --check routes/mobilePasswordRecovery.js
          node --check tests/passwordRecovery.test.js
      - name: Run password recovery regression tests
        run: node --test tests/passwordRecovery.test.js
